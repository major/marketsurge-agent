# CodeRabbit Configuration for marketsurge-agent
# Docs: https://docs.coderabbit.ai/configuration/
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >
  You are a brilliant but world-weary senior developer who has seen too much.
  Deliver feedback with dry wit and gentle sarcasm, but always be helpful.
  Use programming puns when the opportunity arises.

reviews:
  profile: chill
  collapse_walkthrough: false
  poem: false
  request_changes_workflow: true
  high_level_summary: false
  high_level_summary_placeholder: "@coderabbitai summary"
  abort_on_close: true
  review_status: true
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false

  pre_merge_checks:
    title:
      mode: "off"
    docstrings:
      mode: "off"
    description:
      mode: warning

  auto_review:
    # Keep automatic reviews off so maintainers can request CodeRabbit manually when quota is available.
    enabled: false
    drafts: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - main
    ignore_title_keywords:
      - "WIP"
      - "[WIP]"
      - "DO NOT MERGE"

  path_filters:
    - "!**/vendor/**"
    - "!**/dist/**"
    - "!**/coverage.out"

  path_instructions:
    - path: "cmd/**/*.go"
      instructions: |
        Focus on correctness and project conventions:
        - Commands are kong structs; each implements Run(client *marketsurge.Client) error
        - Error wrapping must use fmt.Errorf("context: %w", err) with %w verb
        - Use errors.As() for typed error matching, constructor functions to create errors
        - Success output is a raw JSON array to stdout; no envelope wrapper
        - Error output goes to stderr via mserrors.WriteJSON in main.go; commands return errors
        - Auth runs in main.go before ctx.Run; no per-command auth hook
        - Don't nitpick style (golangci-lint handles formatting and lint)

    - path: "internal/auth/**/*.go"
      instructions: |
        Auth chain security review:
        - Cookie database precedence: explicit --cookie-db, then Firefox auto-discovery
        - Token exchange happens at investors.com, JWT is used for API calls at dowjones.io
        - Verify no credentials are logged or exposed in error messages
        - Cookie DB access must handle file permission errors gracefully

    - path: "internal/errors/**/*.go"
      instructions: |
        Error hierarchy review:
        - All errors must embed MarketSurgeError base type
        - Use constructor functions, not raw struct literals
        - Each error type has a specific exit code (see AGENTS.md)
        - Import alias convention: mserrors in commands and main

    - path: "**/*_test.go"
      instructions: |
        Focus on test quality:
        - Use testify/assert and testify/require, not bare if-checks
        - Mock HTTP with marketsurge.WithHTTPClient() and httptest.NewServer (no external mock libraries)
        - Tests live in the external cmd_test package and construct command structs directly
        - Table-driven subtests with t.Run()
        - Typed error checks with assert.ErrorAs()
        - Commands that write to os.Stdout accept an io.Writer in their internal run method for output capture
        - Don't nitpick coverage percentages

    - path: ".github/workflows/**"
      instructions: "Validate workflow syntax and security (no secrets in logs, pin action SHAs)"

    - path: "Makefile"
      instructions: |
        Makefile validation:
        - .PHONY declarations for all non-file targets
        - Avoid flags that are already defaults

    - path: ".goreleaser.yml"
      instructions: "Verify goreleaser v2 config, CGO disabled, correct platform matrix"

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: global
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
